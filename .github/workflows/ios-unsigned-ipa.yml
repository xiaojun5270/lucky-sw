name: Build LuckyGlass Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "swift-ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

concurrency:
  group: luckyglass-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "Xcode 26 is required for iOS 26 Liquid Glass APIs."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Inspect native project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          xcodebuild \
            -project swift-ios/LuckyGlass.xcodeproj \
            -scheme luckymobile \
            -list | tee artifacts/diagnostics/xcodebuild-list.txt

      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project swift-ios/LuckyGlass.xcodeproj \
            -scheme luckymobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build 2>&1 | tee artifacts/diagnostics/xcodebuild.log

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -name 'LuckyGlass.app' -type d -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "LuckyGlass.app was not produced."
            find build/DerivedData/Build/Products -maxdepth 3 -print || true
            exit 1
          fi

          rm -rf artifacts/Payload
          mkdir -p artifacts/Payload
          ditto "$APP_PATH" artifacts/Payload/LuckyGlass.app
          (
            cd artifacts
            ditto -c -k --sequesterRsrc --keepParent Payload LuckyGlass-unsigned.ipa
          )
          shasum -a 256 artifacts/LuckyGlass-unsigned.ipa \
            | tee artifacts/LuckyGlass-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LuckyGlass-unsigned-ipa
          path: |
            artifacts/LuckyGlass-unsigned.ipa
            artifacts/LuckyGlass-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LuckyGlass-ios-build-diagnostics
          path: artifacts/diagnostics
          if-no-files-found: ignore
          retention-days: 14
